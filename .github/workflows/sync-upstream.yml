name: Sync Upstream

on:
  schedule:
    # Every 6 hours, UTC: 00, 06, 12, 18 UTC (08, 14, 20, 02 CST)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync with upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge upstream master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/SukkaW/Surge.git
          git fetch upstream master
          echo "Before merge (ahead...behind vs upstream):"
          git rev-list --left-right --count HEAD...upstream/master
          git merge upstream/master --no-edit || { echo "Merge conflict, aborting without pushing"; git merge --abort; exit 1; }
          git push origin master
